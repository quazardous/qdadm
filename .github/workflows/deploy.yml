name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build -w packages/demo -- --base=/qdadm/demo/
        env:
          GITHUB_PAGES: true
          VITE_HASH_MODE: true

      - name: Build hello-world
        run: npm run build -w examples/hello-world -- --base=/qdadm/hello-world/

      - name: Build tutorial mini-admin
        run: npm run build -w examples/tutorial-mini-admin -- --base=/qdadm/tutorial/

      - name: Assemble dist
        run: |
          mkdir -p dist
          cp -r packages/demo/dist dist/demo
          cp -r examples/hello-world/dist dist/hello-world
          cp -r examples/tutorial-mini-admin/dist dist/tutorial

      # The landing page lives in site/ (#2266): a static file, reviewed like any other.
      - name: Add the index page
        run: cp site/index.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
